<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Book Club Portal Architecture</title>
  <desc id="desc">A clean layered architecture from actors through the interface, API, business modules, database, monitoring, and backup.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 35px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .heading { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 15px Arial, sans-serif; fill: #475569; }
      .section { font: 700 15px Arial, sans-serif; fill: #334155; letter-spacing: 1px; }
      .arrow { stroke: #334155; stroke-width: 2.7; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2.3; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="920" fill="#f8fafc"/>
  <text x="750" y="52" text-anchor="middle" class="title">Book Club Portal Architecture</text>
  <text x="750" y="82" text-anchor="middle" class="subtitle">Layered modular design with secure and durable data handling</text>

  <text x="55" y="138" class="section">ACTORS</text>
  <rect x="45" y="165" width="205" height="84" rx="15" fill="#ffffff" stroke="#94a3b8" filter="url(#shadow)"/>
  <text x="147" y="199" text-anchor="middle" class="heading">Club Member</text>
  <text x="147" y="224" text-anchor="middle" class="body">Goals, discussion, voting</text>
  <rect x="45" y="280" width="205" height="84" rx="15" fill="#ffffff" stroke="#94a3b8" filter="url(#shadow)"/>
  <text x="147" y="314" text-anchor="middle" class="heading">Discussion Lead</text>
  <text x="147" y="339" text-anchor="middle" class="body">Poll management</text>
  <rect x="45" y="395" width="205" height="84" rx="15" fill="#ffffff" stroke="#94a3b8" filter="url(#shadow)"/>
  <text x="147" y="429" text-anchor="middle" class="heading">Administrator</text>
  <text x="147" y="454" text-anchor="middle" class="body">Membership control</text>

  <text x="320" y="138" class="section">PRESENTATION</text>
  <rect x="305" y="165" width="225" height="314" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="417" y="213" text-anchor="middle" class="heading">Responsive Web UI</text>
  <text x="417" y="257" text-anchor="middle" class="body">Reading dashboard</text>
  <text x="417" y="290" text-anchor="middle" class="body">Discussion threads</text>
  <text x="417" y="323" text-anchor="middle" class="body">Spoiler controls</text>
  <text x="417" y="356" text-anchor="middle" class="body">Monthly poll</text>
  <text x="417" y="389" text-anchor="middle" class="body">Administration</text>
  <text x="417" y="438" text-anchor="middle" class="body">HTTPS and validation</text>

  <text x="600" y="138" class="section">APPLICATION API</text>
  <rect x="585" y="165" width="225" height="314" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="697" y="213" text-anchor="middle" class="heading">Application API</text>
  <text x="697" y="257" text-anchor="middle" class="body">Request validation</text>
  <text x="697" y="290" text-anchor="middle" class="body">Authentication</text>
  <text x="697" y="323" text-anchor="middle" class="body">Role authorization</text>
  <text x="697" y="356" text-anchor="middle" class="body">Transaction control</text>
  <text x="697" y="389" text-anchor="middle" class="body">Error handling</text>
  <text x="697" y="438" text-anchor="middle" class="body">Stable service interface</text>

  <text x="880" y="138" class="section">BUSINESS MODULES</text>
  <rect x="865" y="165" width="265" height="314" rx="20" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="997" y="207" text-anchor="middle" class="heading">Business Modules</text>
  <rect x="890" y="232" width="215" height="42" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="997" y="259" text-anchor="middle" class="body">Reading Challenge</text>
  <rect x="890" y="289" width="215" height="42" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="997" y="316" text-anchor="middle" class="body">Discussion and Spoilers</text>
  <rect x="890" y="346" width="215" height="42" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="997" y="373" text-anchor="middle" class="body">Monthly Poll and Voting</text>
  <rect x="890" y="403" width="215" height="42" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="997" y="430" text-anchor="middle" class="body">Membership Administration</text>

  <text x="1195" y="138" class="section">DATA</text>
  <path d="M1170 198 C1170 163, 1430 163, 1430 198 L1430 446 C1430 481, 1170 481, 1170 446 Z" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="1300" cy="198" rx="130" ry="35" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
  <text x="1300" y="277" text-anchor="middle" class="heading">Relational Database</text>
  <text x="1300" y="321" text-anchor="middle" class="body">Users and memberships</text>
  <text x="1300" y="354" text-anchor="middle" class="body">Goals and progress</text>
  <text x="1300" y="387" text-anchor="middle" class="body">Comments, polls and votes</text>
  <text x="1300" y="430" text-anchor="middle" class="body">Unique member-and-poll key</text>

  <path d="M250 207 H305" class="arrow"/>
  <path d="M250 322 H305" class="arrow"/>
  <path d="M250 437 H305" class="arrow"/>
  <path d="M530 322 H585" class="arrow"/>
  <path d="M810 322 H865" class="arrow"/>
  <path d="M1130 322 H1170" class="arrow"/>

  <text x="585" y="557" class="section">OPERATIONS</text>
  <rect x="585" y="580" width="225" height="100" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="697" y="621" text-anchor="middle" class="heading">Monitoring</text>
  <text x="697" y="650" text-anchor="middle" class="body">Health, errors and uptime</text>
  <rect x="1170" y="580" width="260" height="100" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1300" y="621" text-anchor="middle" class="heading">Backup and Recovery</text>
  <text x="1300" y="650" text-anchor="middle" class="body">Scheduled durable backups</text>
  <path d="M697 479 V580" class="dash"/>
  <path d="M1300 481 V580" class="dash"/>

  <rect x="45" y="760" width="1385" height="100" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="75" y="799" class="heading">Primary integrity rule</text>
  <text x="75" y="832" class="body">Vote records use a single transaction, while the database enforces one vote for each member-and-poll pair.</text>
</svg>
